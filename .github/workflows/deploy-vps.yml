name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-maisbfarma
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validar arquivos essenciais do projeto
        run: |
          echo "Verificando integridade dos arquivos estruturais..."
          for file in Dockerfile docker-compose.yml nginx.conf index.html assets/Logos/logo-maisb-farma.webp; do
            if [ ! -f "$file" ]; then
              echo "ERRO CRÍTICO: Arquivo essencial '$file' não encontrado!" >&2
              exit 1
            fi
            echo "✓ $file OK"
          done

      - name: Configurar SSH e Deploy na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          SCAN_FILE="$(mktemp)"
          AGENT_STARTED=0
          trap 'rm -f "$SCAN_FILE"; if [ "$AGENT_STARTED" -eq 1 ]; then ssh-agent -k >/dev/null 2>&1 || true; fi' EXIT

          echo "Verificando chaves de host da VPS..."
          ssh-keyscan -p "$VPS_PORT" -T 10 -t rsa,ecdsa,ed25519 "$VPS_HOST" > "$SCAN_FILE" 2>/dev/null
          if [ ! -s "$SCAN_FILE" ]; then
            echo "ERRO: Não foi possível obter chaves SSH do host $VPS_HOST." >&2
            exit 1
          fi

          if ! ssh-keygen -lf "$SCAN_FILE" -E sha256 | awk '{print $2}' | grep -Fxq "$VPS_FINGERPRINT"; then
            echo "ERRO DE SEGURANÇA: Fingerprint do host não confere com o segredo VPS_SSH_FINGERPRINT cadastrado!" >&2
            exit 1
          fi
          echo "✓ Identidade do servidor VPS validada com sucesso."

          cat "$SCAN_FILE" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          AGENT_STARTED=1
          if ! printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "ERRO: VPS_SSH_KEY inválida ou rejeitada pelo ssh-add." >&2
            exit 1
          fi

          echo "Iniciando sessão SSH para deploy..."
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER"@"$VPS_HOST" "bash -s" "$TARGET_SHA" << 'REMOTE'
          set -euo pipefail

          TARGET_SHA="$1"
          PROJECT_DIR="/opt/site-maisbfarma/app"

          RESOLVED_DIR=$(realpath "$PROJECT_DIR")
          if [ "$RESOLVED_DIR" = "/" ] || [ "$RESOLVED_DIR" = "/opt" ] || [ "$RESOLVED_DIR" = "/var" ] || [ "$RESOLVED_DIR" = "/home" ] || [ "$RESOLVED_DIR" = "/root" ] || [ -z "$RESOLVED_DIR" ]; then
            echo "ABORTAR: Diretório inválido ou inseguro: $RESOLVED_DIR" >&2
            exit 99
          fi

          cd "$RESOLVED_DIR"

          PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")
          echo "Commit atual na VPS: $PREV_SHA"
          echo "Publicando commit alvo: $TARGET_SHA"

          git fetch origin main
          git reset --hard "$TARGET_SHA"
          git clean -fd

          echo "Executando build e subindo container..."
          if ! docker compose up -d --build --remove-orphans; then
            echo "FALHA NO BUILD! Iniciando procedimento de rollback para $PREV_SHA..." >&2
            if [ "$PREV_SHA" != "none" ]; then
              git reset --hard "$PREV_SHA"
              docker compose up -d --build --remove-orphans || true
            fi
            exit 1
          fi

          echo "Verificando status dos containers..."
          docker compose ps

          echo "Validando resposta local do container..."
          READY=0
          for i in {1..10}; do
            if curl -fsS http://localhost:8086/ > /dev/null 2>&1; then
              echo "✓ Container maisbfarma-web respondendo 200 OK na porta 8086 (tentativa $i)."
              READY=1
              break
            fi
            echo "Aguardando inicialização do Nginx (tentativa $i/10)..."
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERRO: Container não respondeu com sucesso na porta 8086 após 20 segundos!" >&2
            if [ "$PREV_SHA" != "none" ]; then
              echo "Executando rollback para $PREV_SHA..." >&2
              git reset --hard "$PREV_SHA"
              docker compose up -d --build --remove-orphans || true
            fi
            exit 1
          fi

          echo "✓ Deploy na VPS concluído com sucesso."
          REMOTE

      - name: Validar integridade da publicação externa
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Testando endpoint direto da VPS (porta 8086)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://${VPS_HOST}:8086/")
          echo "Status retornado (porta 8086): $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Endpoint http://${VPS_HOST}:8086/ retornou status $HTTP_STATUS (esperado 200)" >&2
            exit 1
          fi

          echo "Testando roteamento Traefik via Host Header..."
          TRAEFIK_STATUS="000"
          for i in {1..6}; do
            TRAEFIK_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: maisbfarma.com.br" "https://${VPS_HOST}/")
            if [ "$TRAEFIK_STATUS" = "200" ]; then
              echo "✓ Traefik sincronizado e respondendo 200 OK (tentativa $i)."
              break
            fi
            echo "Aguardando sincronização do Traefik (tentativa $i/6, status retornado: $TRAEFIK_STATUS)..."
            sleep 2
          done

          if [ "$TRAEFIK_STATUS" != "200" ]; then
            echo "AVISO: Traefik retornou status $TRAEFIK_STATUS para Host: maisbfarma.com.br"
          fi

          echo "=========================================="
          echo "✓ DEPLOY AUTOMÁTICO CONCLUÍDO COM SUCESSO!"
          echo "=========================================="
